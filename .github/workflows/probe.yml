name: 実験 予想データの取得テスト

on:
  push:
    branches: [main]
    paths: ["scripts/ff_probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Forex Factoryの取得テスト（予想値は出力しない）
        run: python scripts/ff_probe.py
