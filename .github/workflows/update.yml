name: 毎日データ更新

on:
  schedule:
    # UTC 月〜金 16:47 ＝ 日本時間 火〜土 1:47（米国の月〜金の発表分）
    # 前夜の米国発表分を取り込める最も早い時刻。最も遅いミシガン大学指数（冬時間で1:02ごろFRED掲載）から約45分後
    - cron: "47 16 * * 1-5"
  push:                      # 修正をmainに反映したら、その場でページを作り直す
    branches: [main]
  workflow_dispatch:         # 手動実行ボタン

permissions:
  contents: write            # 30日ごとの keepalive コミット用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: FREDからデータ取得・判定
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/build_data.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHubは60日間更新のないリポジトリの定期実行を自動停止するため、最後の更新から30日たったら空コミットする
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
