<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米国マクロ指標トラッカー</title>
<meta name="description" content="FREDのデータで米国経済を5つの問いに分けて毎日判定する個人用ダッシュボード">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232a78d6'/><path d='M3 11l3-4 3 2 4-5' stroke='white' stroke-width='1.8' fill='none'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="wrap">
  <h1 id="title">米国マクロ指標トラッカー</h1>
  <p class="sub" id="meta">読み込み中…</p>
  <div id="alerts"></div>
  <div class="aibox">
    <b>AIに渡す</b>
    <button class="btn" data-ai="ai_brief.md">全データの要約をコピー</button>
    <button class="btn" data-ai="ai_full.md">直近24か月の推移つきでコピー</button>
    <span id="aimsg" class="note" role="status"></span>
    <span class="note">（<a href="data/ai_brief.md" download>要約.md</a>／<a href="data/ai_full.md" download>推移つき.md</a>）</span>
  </div>
</header>

<main class="wrap">
  <section>
    <h2>5つの問い（今日の判定）</h2>
    <p class="note">各問いの判定は、主役2本の指標だけで機械的に出しています。補助指標は判定に使わず、下の一覧で確認用に表示しています。</p>
    <div id="questions" class="qgrid"></div>
    <div id="cycle"></div>
  </section>

  <section>
    <h2>気になる動き</h2>
    <div id="notable"></div>
  </section>

  <section>
    <h2>発表予定（今後3週間）</h2>
    <div id="calendar"></div>
  </section>

  <section>
    <h2>指標一覧</h2>
    <div class="filters">
      <div id="chips" class="chips" role="tablist"></div>
      <input id="search" type="search" placeholder="指標名で絞り込み" aria-label="指標名で絞り込み">
    </div>
    <div id="groups"></div>
  </section>

  <section>
    <h2>過去の判定（ルールの検証）</h2>
    <p class="note" id="histnote"></p>
    <div id="history"></div>
    <div id="leads"></div>
  </section>

  <footer>
    <p>出典：FRED（セントルイス連邦準備銀行）ほか各統計の公表元。判定は設定ファイルのルールによる機械的な集計で、投資助言ではありません。</p>
    <p><a href="data/summary.json">summary.json（AI連携用）</a></p>
  </footer>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="close" id="m-close" aria-label="閉じる">×</button>
    <div id="m-body"></div>
  </div>
</div>
<div id="tip" class="tip" hidden></div>

<script src="vendor/chart.umd.js"></script>
<script src="vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
